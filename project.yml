name: GouZhi
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.knitcount
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  GouZhi:
    type: application
    platform: iOS
    sources: [GouZhi, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GouZhi AppStore
    info:
      path: GouZhi/Info.plist
      properties:
        CFBundleDisplayName: 钩织计数
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: 拍摄作品的进度与成品照片
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pattern
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image]
        GouZhiAppGroup: group.$(APP_ID)
        GouZhiProProductID: $(APP_ID).pro
        GouZhiTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
    entitlements:
      path: GouZhi/GouZhi.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
    dependencies:
      - target: GouZhiWidget
  GouZhiWidget:
    type: app-extension
    platform: iOS
    sources: [GouZhiWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GouZhi Widget AppStore
    info:
      path: GouZhiWidget/Info.plist
      properties:
        CFBundleDisplayName: 钩织计数
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GouZhiAppGroup: group.$(APP_ID)
    entitlements:
      path: GouZhiWidget/GouZhiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
  GouZhiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GouZhiTests
      - path: Shared
        excludes: [CountIntent.swift, KnitActivity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  GouZhiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GouZhiUITests]
    dependencies:
      - target: GouZhi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GouZhi
schemes:
  GouZhi:
    build:
      targets:
        GouZhi: all
        GouZhiTests: [test]
    test:
      config: Debug
      targets: [GouZhiTests]
  GouZhiUI:
    build:
      targets:
        GouZhi: all
        GouZhiUITests: [test]
    test:
      config: Debug
      targets: [GouZhiUITests]
